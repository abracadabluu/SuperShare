name: Build SuperShare Debug APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build SuperShare Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js for SuperShare UI Assets
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web UI Assets for Offline APK
        run: |
          npm ci || npm install
          npm run build
          mkdir -p app/src/main/assets
          cp -r dist/* app/src/main/assets/
          if [ -d "android/app/src/main" ]; then
            mkdir -p android/app/src/main/assets
            cp -r dist/* android/app/src/main/assets/
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate Gradle Root and Build Debug APK
        run: |
          GRADLE_DIR="."
          if [ ! -f "$GRADLE_DIR/settings.gradle" ] && [ ! -f "$GRADLE_DIR/settings.gradle.kts" ] && [ ! -f "$GRADLE_DIR/build.gradle" ] && [ ! -f "$GRADLE_DIR/build.gradle.kts" ]; then
            FOUND_DIR=$(dirname $(find . -maxdepth 3 -name "settings.gradle*" | head -n 1) 2>/dev/null)
            if [ -n "$FOUND_DIR" ]; then
              GRADLE_DIR="$FOUND_DIR"
            fi
          fi

          echo "Using Gradle directory: $GRADLE_DIR"
          cd "$GRADLE_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Locate and Prepare Debug APK
        run: |
          mkdir -p build-output
          APK_PATH=$(find . -name "*debug*.apk" -not -path "*/node_modules/*" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" build-output/SuperShare-debug.apk
          fi

      - name: Upload SuperShare Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperShare-debug-apk
          path: build-output/SuperShare-debug.apk
          retention-days: 30
          if-no-files-found: warn
