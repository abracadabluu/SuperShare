name: Build SuperShare Debug APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-debug-apk:
    name: Build SuperShare Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Build Android Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            echo "Gradle wrapper not found, compiling using gradle..."
            gradle assembleDebug --stacktrace
          fi

      - name: Locate and Prepare Debug APK
        run: |
          mkdir -p build-output
          APK_PATH=$(find . -name "*debug*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" build-output/SuperShare-debug.apk
          else
            echo "Looking in standard output folder..."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              cp app/build/outputs/apk/debug/app-debug.apk build-output/SuperShare-debug.apk
            fi
          fi

      - name: Upload SuperShare Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperShare-debug-apk
          path: build-output/SuperShare-debug.apk
          retention-days: 30
          if-no-files-found: warn
