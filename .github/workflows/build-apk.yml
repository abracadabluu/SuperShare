name: Build SuperShare Debug APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-debug-apk:
    name: Build SuperShare Debug APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download (checkout) repository code into runner before any setup
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Set up JDK 17 (without strict cache requirement so it never fails on missing gradle files)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Grant Execute Permission to Gradle Wrapper if present
      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          elif [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
          fi

      # Step 4: Build Android Debug APK
      - name: Build Android Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          elif [ -f "./android/gradlew" ]; then
            cd android && ./gradlew assembleDebug --stacktrace && cd ..
          elif command -v gradle &> /dev/null; then
            gradle assembleDebug --stacktrace
          else
            echo "Gradle wrapper will be initialized or auto-generated..."
            gradle wrapper || true
            if [ -f "./gradlew" ]; then
              chmod +x gradlew
              ./gradlew assembleDebug --stacktrace
            fi
          fi

      # Step 5: Locate and copy generated APK
      - name: Locate and Prepare Debug APK
        run: |
          mkdir -p build-output
          APK_PATH=$(find . -name "*debug*.apk" -not -path "*/node_modules/*" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" build-output/SuperShare-debug.apk
          else
            echo "Searching default Android output directories..."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              cp app/build/outputs/apk/debug/app-debug.apk build-output/SuperShare-debug.apk
            elif [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
              cp android/app/build/outputs/apk/debug/app-debug.apk build-output/SuperShare-debug.apk
            fi
          fi

      # Step 6: Upload SuperShare Debug APK Artifact
      - name: Upload SuperShare Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperShare-debug-apk
          path: build-output/SuperShare-debug.apk
          retention-days: 30
          if-no-files-found: warn
